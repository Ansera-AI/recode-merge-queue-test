name: test
on:
  pull_request:
  merge_group:
  push:
    branches: [main, 'recode-queue/**']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # For recode's "main stays green" test: main breaks only once this marker is on it.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('packages/marker/BREAK_MAIN') != ''
        run: echo "main is broken on purpose by packages/marker/BREAK_MAIN" && exit 1
